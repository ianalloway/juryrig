name: CI

on:
  push:
    branches: [main]
  # Pushes made with GITHUB_TOKEN (Dependabot auto-merge) do not trigger
  # workflows, so main HEAD can end up with no run; this allows a manual one.
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run demo
        run: PYTHONPATH=. python examples/audit_demo.py
      - name: Check the installed package and console script
        run: |
          pip install .
          cd "$(mktemp -d)"  # install must work without the source tree
          python -c "import juryrig; print(juryrig.__version__)"
          juryrig "$GITHUB_WORKSPACE/examples/cases.json"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
